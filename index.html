<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14313a">
<title>Medicamentos de Briana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --fondo:#f3f7f6; --panel:#ffffff; --tinta:#14313a; --suave:#4f666c; --linea:#cfdbd8;
  --dado:#1b6f62; --dado-fondo:#dff1ec; --pend:#8a4b00; --pend-fondo:#fdeed6; --barra:#14313a; --barra-tinta:#ffffff;
  --foco:#0b57d0;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --fondo:#0f1d21; --panel:#172a30; --tinta:#e8f1ef; --suave:#a9bdc0; --linea:#30474d;
    --dado:#7fd6c3; --dado-fondo:#17403a; --pend:#ffc477; --pend-fondo:#43300f; --barra:#0a1518; --barra-tinta:#e8f1ef;
    --foco:#9cc2ff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
[hidden]{display:none !important}
.contenedor{max-width:560px;margin:0 auto;padding:0 16px}

/* Ingreso */
#ingreso{min-height:100vh;min-height:100dvh;display:flex;align-items:center;padding:24px 0}
#ingreso h1{font-size:30px;line-height:1.15;margin:0 0 6px}
#ingreso p{margin:0 0 22px;color:var(--suave)}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-weight:700;margin-bottom:5px}
.campo input{width:100%;height:50px;padding:0 14px;border:2px solid var(--linea);border-radius:10px;background:var(--panel)}
.principal{width:100%;height:52px;border:0;border-radius:10px;background:var(--barra);color:var(--barra-tinta);font-weight:700}
@media (prefers-color-scheme: dark){.principal{background:var(--dado);color:#0f1d21}}
.error{color:var(--pend);font-weight:700;min-height:24px;margin:10px 0 0}

/* Cabecera */
header.barra{background:var(--barra);color:var(--barra-tinta);padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
header.barra h1{font-size:22px;margin:0;line-height:1.2}
header.barra p{margin:2px 0 0;font-size:15px;opacity:.85}

section{margin:18px 0}
h2{font-size:19px;margin:0 0 10px}
.nota{color:var(--suave);font-size:15px;margin:6px 0 0}

/* Navegación del día */
.dia-nav{display:flex;align-items:center;gap:8px;margin-top:16px}
.dia-nav .fecha{flex:1;min-width:0}
.dia-nav .fecha strong{display:block;font-size:22px;line-height:1.2}
.dia-nav .fecha span{color:var(--suave);font-size:15px}
.cuadro{width:48px;height:48px;border:2px solid var(--linea);border-radius:10px;background:var(--panel);font-size:22px;font-weight:700;flex-shrink:0}
.cuadro:disabled{opacity:.35;cursor:default}
.hoy-btn{height:48px;padding:0 14px;border:2px solid var(--tinta);border-radius:10px;background:transparent;font-weight:700;flex-shrink:0}

/* Dosis */
.dosis{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.toma{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px;padding:12px 14px;border:2px solid var(--linea);border-radius:14px;background:var(--panel)}
.toma .marca{width:40px;height:40px;border:2.5px solid var(--tinta);border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1}
.toma .texto{flex:1;min-width:0}
.toma .texto strong{display:block;font-size:18px}
.toma .texto small{display:block;font-size:14.5px;color:var(--suave)}
.toma .estado{font-size:14px;font-weight:700;color:var(--pend);white-space:nowrap}
.toma[aria-pressed="true"]{border-color:var(--dado);background:var(--dado-fondo)}
.toma[aria-pressed="true"] .marca{border-color:var(--dado);background:var(--dado);color:var(--panel)}
.toma[aria-pressed="true"] .estado{color:var(--dado)}
.toma:disabled{opacity:.55;cursor:default}
.toma:disabled .estado{color:var(--suave)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.par .toma{min-height:64px}
.vacio{padding:18px;border:2px dashed var(--linea);border-radius:14px;color:var(--suave)}

/* Pendientes */
.pendientes{border:2px solid var(--pend);background:var(--pend-fondo);border-radius:14px;padding:14px}
.pendientes h2{color:var(--pend)}
.pendientes ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pendientes button{min-height:44px;padding:0 12px;border:2px solid var(--pend);border-radius:999px;background:var(--panel);font-weight:700}
.aldia{border:2px solid var(--dado);background:var(--dado-fondo);border-radius:14px;padding:14px;font-weight:700;color:var(--dado)}

/* Calendario */
.mes-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mes-nav strong{flex:1;text-align:center;font-size:19px;text-transform:capitalize}
.rejilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rejilla .sem{text-align:center;font-size:13px;font-weight:700;color:var(--suave);padding-bottom:2px}
.celda{aspect-ratio:1/1.08;min-height:46px;border:2px solid var(--linea);border-radius:9px;background:var(--panel);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.celda b{font-size:16px;line-height:1}
.celda i{font-style:normal;font-size:12px;line-height:1;font-weight:700;color:var(--suave)}
.celda.fuera{border-style:dashed;opacity:.5}
.celda.completo{background:var(--dado-fondo);border-color:var(--dado)}
.celda.completo i{color:var(--dado)}
.celda.falta{background:var(--pend-fondo);border-color:var(--pend)}
.celda.falta i{color:var(--pend)}
.celda.sel{outline:3px solid var(--tinta);outline-offset:1px}
.celda.es-hoy b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.hueco{visibility:hidden}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--suave);margin-top:10px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda em{width:16px;height:16px;border-radius:5px;border:2px solid var(--linea);display:inline-block}
.leyenda em.c{background:var(--dado-fondo);border-color:var(--dado)}
.leyenda em.f{background:var(--pend-fondo);border-color:var(--pend)}

/* Avance */
.avance{display:flex;flex-direction:column;gap:12px}
.avance .fila div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.avance .fila div:first-child span{color:var(--suave);white-space:nowrap}
.riel{height:10px;border-radius:999px;background:var(--linea);overflow:hidden;margin-top:5px}
.riel i{display:block;height:100%;background:var(--dado);border-radius:999px}
.avance small{color:var(--suave);font-size:14px}

/* Pie */
footer{border-top:2px solid var(--linea);margin-top:26px;padding:16px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.acciones button{min-height:46px;padding:0 14px;border:2px solid var(--linea);border-radius:10px;background:var(--panel);font-weight:700}
</style>
</head>
<body>

<main id="ingreso" hidden>
  <div class="contenedor">
    <h1>Medicamentos de Briana</h1>
    <p>Ingrese para registrar las dosis.</p>
    <label class="campo"><span>Usuario</span>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="campo"><span>Contraseña</span>
      <input id="p" type="password" autocomplete="current-password"></label>
    <button class="principal" id="entrar" type="button">Ingresar</button>
    <p class="error" id="err" role="alert"></p>
  </div>
</main>

<div id="app" hidden>
  <header class="barra"><div class="contenedor">
    <h1>Medicamentos de Briana</h1>
    <p id="resumen"></p>
  </div></header>

  <div class="contenedor">
    <div class="dia-nav">
      <button class="cuadro" id="ant" type="button" aria-label="Día anterior">‹</button>
      <div class="fecha"><strong id="fecha"></strong><span id="fecha-sub"></span></div>
      <button class="hoy-btn" id="irhoy" type="button">Hoy</button>
      <button class="cuadro" id="sig" type="button" aria-label="Día siguiente">›</button>
    </div>
    <div class="dosis" id="dosis"></div>

    <section id="pend"></section>

    <section>
      <h2>Calendario</h2>
      <div class="mes-nav">
        <button class="cuadro" id="mes-ant" type="button" aria-label="Mes anterior">‹</button>
        <strong id="mes"></strong>
        <button class="cuadro" id="mes-sig" type="button" aria-label="Mes siguiente">›</button>
      </div>
      <div class="rejilla" id="rejilla"></div>
      <div class="leyenda">
        <span><em class="c"></em>Día completo</span>
        <span><em class="f"></em>Faltan dosis</span>
        <span><em></em>Por venir</span>
      </div>
      <p class="nota">El número pequeño indica dosis dadas sobre dosis del día.</p>
    </section>

    <section>
      <h2>Avance de cada tratamiento</h2>
      <div class="avance" id="avance"></div>
    </section>

    <footer>
      <div class="acciones">
        <button id="exportar" type="button">Descargar respaldo</button>
        <button id="importar" type="button">Restaurar respaldo</button>
        <button id="salir" type="button">Cerrar sesión</button>
      </div>
      <input id="archivo" type="file" accept="application/json,.json" hidden>
      <p class="nota" id="aviso">Conectando…</p>
    </footer>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====================================================================
   CONFIGURACIÓN DE FIREBASE: reemplace este bloque por el que entrega
   la consola de Firebase (Configuración del proyecto > Tus apps > Web).
   ==================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDExbUuA1-zNC7ZyzG62Sq51sFdjHFxyHY",
  authDomain: "administracion-bsa.firebaseapp.com",
  databaseURL: "https://administracion-bsa-default-rtdb.firebaseio.com",
  projectId: "administracion-bsa",
  storageBucket: "administracion-bsa.firebasestorage.app",
  messagingSenderId: "890774421886",
  appId: "1:890774421886:web:fbe43080ed344ae6cdb32f"
};
/* El usuario "padresbriana" se convierte internamente en este correo. */
const DOMINIO_USUARIO = "@example.com";

(function(){
"use strict";
var configurado = firebaseConfig.apiKey.indexOf("PEGAR")!==0;
var auth = null, db = null;
if(configurado){ var fb = initializeApp(firebaseConfig); auth = getAuth(fb); db = getDatabase(fb); }

/* ---------- Configuración de la fórmula (06 nov 2026) ---------- */
var INICIO = "2026-11-09";
var MEDS = [
  {id:"SP", nombre:"Start Protect",          dosis:"1 sachet disuelto en agua, 20 minutos lejos de comidas", fin:"2027-02-08"},
  {id:"UP", nombre:"Up Children",            dosis:"1 sachet disuelto en agua",                              fin:"2027-01-08"},
  {id:"DK", nombre:"DK Mulsion gotas",       dosis:"3 gotas vía oral",                                       fin:"2027-05-08"},
  {id:"SU", nombre:"Sulfur 15 CH glóbulos",  dosis:"5 glóbulos; dar 5 golpes al frasco antes de la toma",    fin:"2026-12-08"}
];
var FIN_TOTAL = "2027-05-08";
var AC_TOTAL = 12; /* Acerumen: 2 aplicaciones al día, 3 días por semana, 2 semanas */
var K_DATOS = "briana-meds-v1";

/* ---------- Utilidades ---------- */
var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function $(id){ return document.getElementById(id); }
function p2(n){ return (n<10?"0":"")+n; }
function clave(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function fecha(k){ var a=k.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
function suma(k,n){ var d=fecha(k); d.setDate(d.getDate()+n); return clave(d); }
function hoy(){ return clave(new Date()); }
function dias(a,b){ return Math.round((fecha(b)-fecha(a))/86400000); }
function corta(k){ var d=fecha(k); return d.getDate()+" "+MESES[d.getMonth()].slice(0,3); }
function hora(iso){ var d=new Date(iso); if(isNaN(d)) return ""; var h=d.getHours(), m=p2(d.getMinutes()); var s=h<12?"a. m.":"p. m."; h=h%12||12; return h+":"+m+" "+s; }

var memoria = {};
function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return memoria[k]||null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ memoria[k]=v; return false; } }
function borrar(k){ try{ localStorage.removeItem(k); }catch(e){ delete memoria[k]; } }

/* ---------- Estado ---------- */
var datos = {};
var sel = hoy();
if(sel < INICIO) sel = INICIO;
if(sel > FIN_TOTAL) sel = FIN_TOTAL;
var mesVista = sel.slice(0,7);

function falla(){ $("aviso").textContent = "No se pudo guardar el cambio. Revise la conexión e intente de nuevo."; }
function activos(k){ return MEDS.filter(function(m){ return k>=INICIO && k<=m.fin; }); }
function dado(k,id){ return datos[k] && datos[k][id]; }
function cuenta(k){ var a=activos(k), n=0; a.forEach(function(m){ if(dado(k,m.id)) n++; }); return {dadas:n,total:a.length}; }
function acerumen(){ var n=0; Object.keys(datos).forEach(function(k){ if(datos[k].AC_AM) n++; if(datos[k].AC_PM) n++; }); return n; }
function alternar(k,id){
  if(k>hoy()) return;
  var v = dado(k,id) ? null : new Date().toISOString();
  set(ref(db, "registros/"+k+"/"+id), v).catch(falla);
}

/* ---------- Pintado ---------- */
function botonToma(id,nombre,detalle,k){
  var v = dado(k,id), futuro = k>hoy();
  var estado = futuro ? "Aún no" : (v ? "Dado "+hora(v) : "Pendiente");
  return '<button type="button" class="toma" data-id="'+id+'" aria-pressed="'+(v?"true":"false")+'"'+(futuro?" disabled":"")+'>'+
    '<span class="marca" aria-hidden="true">'+(v?"✓":"")+'</span>'+
    '<span class="texto"><strong>'+nombre+'</strong>'+(detalle?'<small>'+detalle+'</small>':'')+'</span>'+
    '<span class="estado">'+estado+'</span></button>';
}
function pintarDia(){
  var d = fecha(sel), h = hoy();
  var t = DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()];
  $("fecha").textContent = t.charAt(0).toUpperCase()+t.slice(1);
  var c = cuenta(sel);
  $("fecha-sub").textContent = (sel===h?"Hoy · ":"") + (c.total? c.dadas+" de "+c.total+" dosis dadas" : "Sin dosis programadas");
  $("ant").disabled = sel<=INICIO; $("sig").disabled = sel>=FIN_TOTAL;
  $("irhoy").hidden = (sel===h) || h<INICIO || h>FIN_TOTAL;

  var html = activos(sel).map(function(m){ return botonToma(m.id,m.nombre,m.dosis,sel); }).join("");
  var nAc = acerumen(), tieneAc = dado(sel,"AC_AM")||dado(sel,"AC_PM");
  if(sel<=h && (nAc<AC_TOTAL || tieneAc)){
    html += '<div><div class="par">'+botonToma("AC_AM","Acerumen","mañana",sel)+botonToma("AC_PM","Acerumen","noche",sel)+'</div>'+
      '<p class="nota">Oído derecho, 1 spray. Marque solo los días indicados por la pediatra. Aplicaciones registradas: '+nAc+' de '+AC_TOTAL+'.</p></div>';
  }
  $("dosis").innerHTML = html || '<p class="vacio">No hay dosis programadas para este día.</p>';
}
function pintarPendientes(){
  var h = hoy(), lista = [], total = 0;
  for(var k=INICIO; k<h && k<=FIN_TOTAL; k=suma(k,1)){
    var c = cuenta(k); if(c.total && c.dadas<c.total){ lista.push({k:k,f:c.total-c.dadas}); total += c.total-c.dadas; }
  }
  var el = $("pend");
  if(h<INICIO){ el.innerHTML = ""; return; }
  if(!lista.length){ el.innerHTML = '<p class="aldia">Los días anteriores están completos.</p>'; return; }
  var visibles = lista.slice(-12).reverse();
  el.innerHTML = '<div class="pendientes"><h2>'+total+' dosis sin marcar en días anteriores</h2><ul>'+
    visibles.map(function(x){ return '<li><button type="button" data-ir="'+x.k+'">'+corta(x.k)+' · '+x.f+'</button></li>'; }).join("")+
    '</ul>'+(lista.length>visibles.length?'<p class="nota">Se muestran los 12 días más recientes de '+lista.length+'.</p>':'')+'</div>';
}
function pintarMes(){
  var a = mesVista.split("-"), y = +a[0], m = +a[1]-1, h = hoy();
  $("mes").textContent = MESES[m]+" "+y;
  $("mes-ant").disabled = mesVista<=INICIO.slice(0,7); $("mes-sig").disabled = mesVista>=FIN_TOTAL.slice(0,7);
  var html = ["L","M","X","J","V","S","D"].map(function(s){ return '<div class="sem">'+s+'</div>'; }).join("");
  var primero = new Date(y,m,1), desfase = (primero.getDay()+6)%7, n = new Date(y,m+1,0).getDate();
  for(var i=0;i<desfase;i++) html += '<div class="celda hueco"></div>';
  for(var d=1; d<=n; d++){
    var k = y+"-"+p2(m+1)+"-"+p2(d), c = cuenta(k), cls = "celda", txt = "";
    if(!c.total) cls += " fuera";
    else{
      txt = c.dadas+"/"+c.total;
      if(c.dadas===c.total) cls += " completo";
      else if(k<h || (k===h && c.dadas>0)) cls += " falta";
    }
    if(k===sel) cls += " sel";
    if(k===h) cls += " es-hoy";
    var etiqueta = d+" de "+MESES[m]+(c.total? ", "+c.dadas+" de "+c.total+" dosis" : ", sin dosis");
    html += '<button type="button" class="'+cls+'" data-ir="'+k+'" aria-label="'+etiqueta+'"'+(c.total?"":" disabled")+'><b>'+d+'</b><i>'+txt+'</i></button>';
  }
  $("rejilla").innerHTML = html;
}
function pintarAvance(){
  var h = hoy();
  var html = MEDS.map(function(m){
    var total = dias(INICIO,m.fin)+1, n = 0;
    Object.keys(datos).forEach(function(k){ if(k>=INICIO && k<=m.fin && datos[k][m.id]) n++; });
    var pct = Math.round(100*n/total);
    var resto = h>m.fin ? "Terminado" : "Termina el "+corta(m.fin)+" "+m.fin.slice(0,4);
    return '<div class="fila"><div><strong>'+m.nombre+'</strong><span>'+n+' de '+total+' días</span></div>'+
      '<div class="riel" role="img" aria-label="'+pct+' por ciento"><i style="width:'+pct+'%"></i></div><small>'+resto+'</small></div>';
  }).join("");
  var nAc = acerumen();
  html += '<div class="fila"><div><strong>Acerumen spray</strong><span>'+nAc+' de '+AC_TOTAL+' aplicaciones</span></div>'+
    '<div class="riel" role="img" aria-label="'+Math.round(100*nAc/AC_TOTAL)+' por ciento"><i style="width:'+Math.min(100,Math.round(100*nAc/AC_TOTAL))+'%"></i></div></div>';
  $("avance").innerHTML = html;
}
function pintar(){
  var h = hoy(), c = cuenta(h);
  $("resumen").textContent = h<INICIO ? "El tratamiento inicia el "+corta(INICIO) :
    h>FIN_TOTAL ? "Tratamiento finalizado" :
    (c.dadas===c.total ? "Hoy: todas las dosis dadas" : "Hoy: faltan "+(c.total-c.dadas)+" de "+c.total+" dosis");
  pintarDia(); pintarPendientes(); pintarMes(); pintarAvance();
}
function ir(k){ if(k<INICIO||k>FIN_TOTAL) return; sel = k; mesVista = k.slice(0,7); pintar(); }

/* ---------- Eventos ---------- */
$("dosis").addEventListener("click", function(e){ var b = e.target.closest("[data-id]"); if(b && !b.disabled) alternar(sel, b.getAttribute("data-id")); });
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-ir]"); if(!b || b.disabled) return;
  ir(b.getAttribute("data-ir")); window.scrollTo({top:0, behavior:"smooth"});
});
$("ant").onclick = function(){ ir(suma(sel,-1)); };
$("sig").onclick = function(){ ir(suma(sel,1)); };
$("irhoy").onclick = function(){ ir(hoy()); };
function moverMes(n){ var a = mesVista.split("-"), d = new Date(+a[0], +a[1]-1+n, 1); mesVista = d.getFullYear()+"-"+p2(d.getMonth()+1); pintarMes(); }
$("mes-ant").onclick = function(){ moverMes(-1); };
$("mes-sig").onclick = function(){ moverMes(1); };

$("exportar").onclick = function(){
  var blob = new Blob([JSON.stringify({app:"briana-meds", version:1, exportado:new Date().toISOString(), datos:datos}, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "respaldo-medicamentos-"+hoy()+".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};
$("importar").onclick = function(){ $("archivo").click(); };
$("archivo").onchange = function(){
  var f = this.files[0]; if(!f) return; var r = new FileReader(), campo = this;
  r.onload = function(){
    try{
      var j = JSON.parse(r.result), nuevos = j && j.datos;
      if(!nuevos || typeof nuevos!=="object" || Array.isArray(nuevos)) throw new Error("formato");
      var limpio = {};
      Object.keys(nuevos).forEach(function(k){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || typeof nuevos[k]!=="object" || !nuevos[k]) return;
        var o = {}; Object.keys(nuevos[k]).forEach(function(id){ if(/^(SP|UP|DK|SU|AC_AM|AC_PM)$/.test(id) && nuevos[k][id]) o[id] = String(nuevos[k][id]); });
        if(Object.keys(o).length) limpio[k] = o;
      });
      if(confirm("Se reemplazarán los registros compartidos por los del respaldo, en todos los dispositivos. ¿Continuar?")){ set(ref(db,"registros"), limpio).catch(falla); }
    }catch(e){ alert("El archivo no es un respaldo válido de esta aplicación."); }
    campo.value = "";
  };
  r.readAsText(f);
};
$("salir").onclick = function(){ signOut(auth); };

/* ---------- Ingreso y sincronización ---------- */
function mostrar(dentro){
  $("ingreso").hidden = dentro; $("app").hidden = !dentro;
  if(dentro){ sel = hoy(); if(sel<INICIO) sel=INICIO; if(sel>FIN_TOTAL) sel=FIN_TOTAL; mesVista = sel.slice(0,7); pintar(); }
  else { $("p").value = ""; }
}
function entrar(){
  var u = $("u").value.trim().toLowerCase(), p = $("p").value;
  if(!configurado){ $("err").textContent = "Falta pegar la configuración de Firebase en index.html."; return; }
  if(!u || !p){ $("err").textContent = "Escriba el usuario y la contraseña."; return; }
  $("err").textContent = ""; $("entrar").disabled = true;
  signInWithEmailAndPassword(auth, u.indexOf("@")>0 ? u : u+DOMINIO_USUARIO, p).catch(function(e){
    var c = (e && e.code) || "";
    $("err").textContent = c==="auth/network-request-failed" ? "Sin conexión a internet." :
      c==="auth/too-many-requests" ? "Demasiados intentos. Espere unos minutos." :
      /invalid|wrong-password|user-not-found/.test(c) ? "Usuario o contraseña incorrectos." : "No se pudo ingresar ("+c+").";
  }).then(function(){ $("entrar").disabled = false; });
}
$("entrar").onclick = entrar;
$("p").addEventListener("keydown", function(e){ if(e.key==="Enter") entrar(); });
$("u").addEventListener("keydown", function(e){ if(e.key==="Enter") $("p").focus(); });

/* Sube una sola vez lo que se haya registrado en este dispositivo con la versión anterior. */
var migrado = false;
function migrar(){
  if(migrado) return; migrado = true;
  var local; try{ local = JSON.parse(leer(K_DATOS)||"null"); }catch(e){ local = null; }
  if(!local || typeof local!=="object") return;
  var cambios = {}, n = 0;
  Object.keys(local).forEach(function(k){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !local[k]) return;
    Object.keys(local[k]).forEach(function(id){
      if(/^(SP|UP|DK|SU|AC_AM|AC_PM)$/.test(id) && local[k][id] && !dado(k,id)){ cambios[k+"/"+id] = String(local[k][id]); n++; }
    });
  });
  if(!n){ borrar(K_DATOS); return; }
  update(ref(db,"registros"), cambios).then(function(){ borrar(K_DATOS); }).catch(function(){ migrado = false; });
}

var soltar = [];
if(!configurado){
  mostrar(false); $("err").textContent = "Falta pegar la configuración de Firebase en index.html.";
}else{
  onAuthStateChanged(auth, function(usuario){
    soltar.forEach(function(f){ f(); }); soltar = [];
    if(!usuario){ datos = {}; mostrar(false); return; }
    $("err").textContent = ""; mostrar(true);
    soltar.push(onValue(ref(db,"registros"), function(s){ datos = s.val() || {}; migrar(); pintar(); },
      function(){ $("aviso").textContent = "Esta cuenta no tiene permiso para ver los registros. Revise las reglas de la base de datos."; }));
    soltar.push(onValue(ref(db,".info/connected"), function(s){
      $("aviso").textContent = s.val() ? "Sincronizado. Los registros se comparten entre todos los dispositivos." : "Sin conexión. Los cambios se enviarán al reconectar.";
    }));
  });
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !$("app").hidden) pintar(); });
})();
</script>
